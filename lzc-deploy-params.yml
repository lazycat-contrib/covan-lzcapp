      description: 使用上述 Supabase JWT 密钥生成的 anon JWT
    service_role_key:
      name: Supabase 服务角色密钥
      description: 使用上述 Supabase JWT 密钥生成的 service_role JWT，请严格保密
    openai_base_url:
      name: OpenAI 兼容接口地址
