params:
  - id: openai_api_key
    type: secret
    name: OpenAI API Key
    description: API key used for chat completions, embeddings, and audio transcription
    optional: false

  - id: jwt_secret
    type: secret
    name: Supabase JWT Secret
    description: Private signing secret of at least 32 characters; generate the anon and service-role JWTs from this exact secret
    default_value: "f1e187fd4247f118826c7b25b9d2ebadcf5c84009e93893ba2f5f8cf425479db"
    optional: false

  - id: anon_key
    type: secret
    name: Supabase Anon Key
    description: Anon JWT generated from the configured Supabase JWT secret
    default_value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE3ODg0OTA4MDAsImV4cCI6NDEwMjQ0NDgwMH0.JhYHi-zfRB5F0WhHebEDo6BiArpnwQQvWt6SXmvjIfQ"
    optional: false

  - id: service_role_key
    type: secret
    name: Supabase Service Role Key
    description: Service-role JWT generated from the configured Supabase JWT secret; keep it private
    default_value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGVtbyIsImlhdCI6MTc4ODg0OTA4MDAsImV4cCI6NDEwMjQ0NDgwMH0.UAPU6RnyKB6Do53TW7LBwqd0LdzWXR4YipwGst8xA58"
    optional: false

  - id: openai_base_url
    type: string
    name: OpenAI-compatible Base URL
    description: Optional OpenAI-compatible endpoint for conversations; leave empty to use api.openai.com
    optional: true

  - id: openai_model
    type: string
    name: OpenAI Model
    description: Optional chat model override; leave empty to use Covan's default
    optional: true

  - id: disable_signup
    type: bool
    name: Disable New Sign-ups
    description: Disable creation of new Covan accounts; leave disabled until the first team account has been created
    default_value: "false"
    optional: true

locales:
  zh:
    openai_api_key:
      name: OpenAI API 密钥
      description: 用于对话补全、向量嵌入和语音转录的 API 密钥
    jwt_secret:
      name: Supabase JWT 密钥
      description: 至少 32 个字符的签名密钥；匿名和服务角色 JWT 必须由此密钥生成
    anon_key:
      name: Supabase 匿名密钥
      description: 使用上述 Supabase JWT 密钥生成的 anon JWT
    service_role_key:
      name: Supabase 服务角色密钥
      description: 使用上述 Supabase JWT 密钥生成的 service_role JWT，请严格保密
    openai_base_url:
      name: OpenAI 兼容接口地址
      description: 可选的对话接口地址；留空使用 api.openai.com
    openai_model:
      name: OpenAI 模型
      description: 可选的对话模型覆盖；留空使用 Covan 默认值
    disable_signup:
      name: 禁止新用户注册
      description: 禁止创建新的 Covan 账号；首次创建团队账号前请保持关闭
  en:
    openai_api_key:
      name: OpenAI API Key
      description: API key used for chat completions, embeddings, and audio transcription
    jwt_secret:
      name: Supabase JWT Secret
      description: Signing secret of at least 32 characters; both API JWTs must be generated from it
    anon_key:
      name: Supabase Anon Key
      description: Anon JWT generated from the configured JWT secret
    service_role_key:
      name: Supabase Service Role Key
      description: Service-role JWT generated from the configured JWT secret; keep it private
    openai_base_url:
      name: OpenAI-compatible Base URL
      description: Optional conversation endpoint; leave empty to use api.openai.com
    openai_model:
      name: OpenAI Model
      description: Optional chat model override; leave empty to use Covan's default
    disable_signup:
      name: Disable New Sign-ups
      description: Disable new Covan accounts; leave disabled until the first team account exists
