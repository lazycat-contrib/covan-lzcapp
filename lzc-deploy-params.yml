params:
  - id: openai_api_key
    type: secret
    name: OpenAI API Key
    description: API key used for chat completions, embeddings, and audio transcription
    optional: false

  - id: jwt_secret
    type: secret
    name: Supabase JWT Secret
    description: A private Supabase JWT signing secret of at least 32 characters; ANON_KEY and SERVICE_ROLE_KEY must be generated from this exact secret
    optional: false

  - id: anon_key
    type: secret
    name: Supabase Anon Key
    description: The anon JWT generated from the configured Supabase JWT secret
    optional: false

  - id: service_role_key
    type: secret
    name: Supabase Service Role Key
    description: The service_role JWT generated from the configured Supabase JWT secret; keep this value private
    optional: false

  - id: openai_base_url
    type: string
    name: OpenAI-compatible Base URL
    description: Optional OpenAI-compatible endpoint for conversations; leave empty to use api.openai.com
    optional: true

  - id: openai_model
    type: string
    name: OpenAI Model
    description: Optional chat model override; leave empty to use Covan's default
    optional: true

  - id: disable_signup
    type: bool
    name: Disable New Sign-ups
    description: Disable creation of new Covan accounts; leave disabled until the first team account has been created
    default_value: "false"
    optional: true

locales:
